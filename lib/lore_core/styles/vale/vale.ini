# Packaged default Vale config for the writing rules (docs/adr/0006-...).
# StylesPath is relative to this file, so `vale --config <this-path> <file>`
# works from any cwd and needs nothing inside the user's repo. The rule
# files live in WritingRules/, sibling to this ini.
StylesPath = .
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = WritingRules
