# Packaged default Vale config for the writing rules (docs/adr/0006-...).
# StylesPath is relative to this file, so `vale --config <this-path> <file>`
# works from any cwd and needs nothing inside the user's repo. The rule
# files live in WritingRules/, sibling to this ini.
StylesPath = .
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = WritingRules
# Off in the packaged config: the short-name check treats the repo's glossary
# as its ignore list, and a repo with no glossary would see every domain word
# flagged. `lore style vale-config` flips this line to YES in the copy it
# writes when it finds a CONTEXT.md.
WritingRules.UnknownShortName = NO
# The hyphenated half of the same check (`C-ext`), switched with it.
WritingRules.HyphenatedShortName = NO
# Rule 22 (absolutes) covers ADR and PRD text only. An issue draft or a how-to
# may say `must`. The pattern matches a relative and an absolute path alike.
WritingRules.Absolutes = NO

[**/docs/{adr,prd}/*.md]
WritingRules.Absolutes = YES
# An invariant line binds, so it may say `must`. The pattern covers the list
# item from `**Invariant**` to its end, wrapped continuation lines included.
TokenIgnores = (\*\*Invariant\*\*[^\n]*(?:\n[ \t]+[^\n]+)*)
