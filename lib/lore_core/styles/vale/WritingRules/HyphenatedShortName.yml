# Rule 20, hyphenated half: a hyphenated token with a segment of one or two
# letters, such as `C-ext`, is a short name rather than an English compound.
#
# UnknownShortName.yml cannot see it. Vale 3.22 applies Hunspell's default
# BREAK rules, so the dictionary accepts a hyphenated token once each segment
# is a word, and `C` and `ext` both are. The length floor of three letters
# matches the compound filter in UnknownShortName.yml.
#
# The glossary exempts a term here too: `vale_config_for` appends the repo's
# glossary terms to this file as `exceptions` in the copy it writes, and
# switches the rule on beside UnknownShortName. warning, like that rule.
extends: existence
message: "Rule 20 (short name): '%s' is in neither the glossary nor common English."
level: warning
nonword: true
raw:
  - '(?<![\w-])(?=(?:[A-Za-z]+-)*[A-Za-z]{1,2}(?![A-Za-z]))[A-Za-z]+(?:-[A-Za-z]+)+(?![\w-])'
