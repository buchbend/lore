name: ci

# The prerequisite gate for every PR into epic/161 and main. Keep pytest
# green. ruff is advisory (continue-on-error) until the repo-wide
# lint/format cleanup lands — see #196 — so it reports without blocking.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e .[dev]

      - name: pytest
        run: pytest -q

      # ADR 0015: each ADR from 0014 on carries `## Holds`, and each
      # invariant line names a test that exists. Blocking.
      - name: lore lint adr
        run: lore lint adr

      # PRD 0015: Vale with the Lore config over docs/**/*.md. Pinned to the
      # version the Vale tests run against.
      - name: Install Vale
        env:
          VALE_VERSION: "3.22.0"
        run: |
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Fails on error level only. tools/vale-docs-baseline.json holds the
      # error count of docs older than this step; a file fails above it.
      - name: vale docs
        run: python3 tools/vale_docs.py --config "$(lore style vale-config)"

      # advisory until repo is ruff-clean — see #196
      - name: ruff check
        continue-on-error: true
        run: ruff check .

      # advisory until repo is ruff-clean — see #196
      - name: ruff format --check
        continue-on-error: true
        run: ruff format --check .
